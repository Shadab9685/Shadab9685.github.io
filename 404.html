<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Page Not Found | Shadab Alam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #030712;
      --card:   #0d1117;
      --border: rgba(255,255,255,0.08);
      --indigo: #6366f1;
      --violet: #8b5cf6;
      --text:   #f1f5f9;
      --text-muted: #94a3b8;
      --font-sans: 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 500px; height: 500px; background: rgba(99,102,241,0.12); top: -150px; right: -150px; }
    .orb-2 { width: 400px; height: 400px; background: rgba(139,92,246,0.08); bottom: -100px; left: -100px; }

    /* Navbar */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 3rem;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }
    .logo-badge {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700; color: #fff;
    }
    .logo-name {
      font-size: 1.1rem; font-weight: 700;
      background: linear-gradient(135deg, #f1f5f9 40%, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Main content */
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    .error-code {
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #f1f5f9 0%, #c7d2fe 40%, #818cf8 70%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
      margin-bottom: 1.5rem;
    }

    .error-title {
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .error-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 2.5rem;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 2rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(99,102,241,0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-home:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 40px rgba(99,102,241,0.55);
    }

    /* Glitch animation on 404 */
    .error-code {
      animation: glitch 4s infinite;
    }
    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      92%            { transform: translate(-3px, 1px); }
      94%            { transform: translate(3px, -1px); }
      96%            { transform: translate(-2px, 2px); }
      98%            { transform: translate(2px, -2px); }
    }

    /* Divider dot */
    .dot-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .dot-divider span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--indigo);
      opacity: 0.5;
    }
    .dot-divider span:nth-child(2) { opacity: 1; width: 8px; height: 8px; }

    @media (max-width: 480px) {
      nav { padding: 1rem 1.5rem; }
      .logo-name { display: none; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <nav>
    <a href="/" class="nav-logo">
      <div class="logo-badge">SA</div>
      <span class="logo-name">Shadab Alam</span>
    </a>
  </nav>

  <div class="container">
    <div class="error-code">404</div>

    <div class="dot-divider">
      <span></span><span></span><span></span>
    </div>

    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The page you're looking for doesn't exist or has been moved.
      Let's get you back on track.
    </p>

    <a href="/" class="btn-home">
      <i class="fas fa-arrow-left"></i>
      Back to Home
    </a>
  </div>

</body>
</html>
